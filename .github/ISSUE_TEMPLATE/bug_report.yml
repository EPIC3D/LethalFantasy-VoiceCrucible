name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** post personal data (names, e-mail, IP addresses, keys).
        `crucible.cmd diagnose` removes them for you – please still check before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [setup, coordinator / watcher, worker, pairing, render / report, direct (AI director), update, other]
    validations:
      required: true
  - type: textarea
    id: diagnose
    attributes:
      label: Output of `crucible.cmd diagnose`
      description: Paste the content of `logs\diagnose.txt`.
      render: text
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message (if any)
      description: Copy the error text from the window, or the relevant lines of the log in `logs\`.
      render: text
